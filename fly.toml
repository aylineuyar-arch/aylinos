app = "aylinos"
primary_region = "ewr"

[build]

[env]
  PORT = "8000"
  DATA_DIR = "/data"

[mounts]
  source = "aylinos_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
